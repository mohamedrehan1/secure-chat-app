[build]
  command = "npm run build"
  publish = "dist"

# script-src: 'wasm-unsafe-eval' lets the QR scanner fallback compile its self-hosted WebAssembly.
# style-src: 'unsafe-inline' because the toast library injects a <style> tag at runtime.
# connect-src: the Nostr relays used for opt-in auto-reconnect (keep in sync with src/common/rendezvous/relays.ts).
# WebRTC traffic (STUN, peer connections) isn't governed by connect-src.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss://relay.damus.io wss://nos.lol wss://relay.primal.net wss://nostr.mom wss://offchain.pub; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(), payment=(), usb=(), interest-cohort=()"
    X-Content-Type-Options = "nosniff"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000"

# Hashed build files never change; the service worker must always be revalidated so updates arrive.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
